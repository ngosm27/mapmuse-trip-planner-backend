services:
    server:
        build:
            context: .
            dockerfile: Dockerfile

        ports:
            - "8080:8080"

        environment:
            SPRING_PROFILES_ACTIVE: docker
            DB_URL: ${DB_URL}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            GOOGLE_API_KEY: ${GOOGLE_API_KEY}
